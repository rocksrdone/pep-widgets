<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stills Gallery</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{ --bg:#fff; --fg:#1c1c1c; --muted:#6b7280; --line:#e3e3e6; --chip:#f3f4f6; --accent:#16b378; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1e1e1e; --fg:#eaeaea; --muted:#9aa0a6; --line:#3a3a3a; --chip:#2c2c2c; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5}
  input[type=search]{flex:1;min-width:120px;padding:5px 9px;border:1px solid var(--line);
    border-radius:14px;background:var(--chip);color:var(--fg);font-size:12px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  select{padding:5px 8px;border:1px solid var(--line);border-radius:14px;background:var(--chip);
    color:var(--fg);font-size:12px}
  .hint{color:var(--muted);font-size:11px;white-space:nowrap}
  #grid{display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  figure{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--chip);
    cursor:zoom-in}
  figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
  figcaption{padding:5px 7px}
  .n{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .s{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #msg{padding:24px;color:var(--muted);text-align:center;line-height:1.7}
  code{background:var(--chip);padding:1px 4px;border-radius:3px;font-size:11px}
  #box{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;
    justify-content:center;flex-direction:column;gap:10px;z-index:50;cursor:zoom-out;padding:16px}
  #box img{max-width:100%;max-height:85%;object-fit:contain}
  #box div{color:#eee;font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="bar">
  <input type="search" id="q" placeholder="Search name, film, caption&hellip;" autocomplete="off">
  <select id="purpose"><option value="">All purposes</option></select>
  <span class="hint" id="count"></span>
</div>
<div id="msg">Waiting for data&hellip;</div>
<div id="grid"></div>
<div id="box"><img alt=""><div></div></div>

<script>
(function(){
  "use strict";
  var recs = [], tok = null, tokAt = 0;
  var grid = document.getElementById('grid'),
      msg  = document.getElementById('msg'),
      q    = document.getElementById('q'),
      sel  = document.getElementById('purpose'),
      cnt  = document.getElementById('count'),
      box  = document.getElementById('box');

  function show(h){ msg.style.display = h ? 'block' : 'none'; if(h) msg.innerHTML = h; }

  function firstAttachment(v){
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return v;
    if (Array.isArray(v)){ var a = (v[0]==='L') ? v.slice(1) : v; return a.length ? a[0] : null; }
    return null;
  }
  async function accessToken(){
    if (!tok || (Date.now() - tokAt) > 60000){
      tok = await grist.docApi.getAccessToken({readOnly:true});
      tokAt = Date.now();
    }
    return tok;
  }
  function txt(v){ return v === null || v === undefined ? '' : String(v); }

  async function render(){
    if (!recs.length){ grid.innerHTML=''; cnt.textContent=''; show('No stills in this view yet.'); return; }
    var t;
    try { t = await accessToken(); }
    catch(e){
      show('Could not get an access token for attachments.<br>' +
           '<span class="hint">Set access to <code>Read selected table</code> or higher.</span>');
      return;
    }
    var needle = q.value.trim().toLowerCase();
    var want = sel.value;
    var list = recs.filter(function(r){
      if (want && txt(r.Purpose) !== want) return false;
      if (!needle) return true;
      return (txt(r.Name) + ' ' + txt(r.Film) + ' ' + txt(r.Caption) + ' ' + txt(r.Purpose))
             .toLowerCase().indexOf(needle) >= 0;
    });
    show(list.length ? '' : 'Nothing matches that search.');
    cnt.textContent = list.length + ' / ' + recs.length;

    grid.innerHTML = '';
    list.forEach(function(r){
      var id = firstAttachment(r.Image);
      if (!id) return;
      var url = t.baseUrl + '/attachments/' + id + '/download?auth=' + encodeURIComponent(t.token);
      var fig = document.createElement('figure');
      var img = document.createElement('img');
      img.src = url; img.loading = 'lazy'; img.alt = txt(r.Name);
      var cap = document.createElement('figcaption');
      var n = document.createElement('div'); n.className='n';
      n.textContent = txt(r.Name) || txt(r.Caption) || '(untitled)';
      var s = document.createElement('div'); s.className='s';
      s.textContent = [txt(r.Film), txt(r.Timecode)].filter(Boolean).join(' \u00b7 ');
      cap.appendChild(n); cap.appendChild(s);
      fig.appendChild(img); fig.appendChild(cap);
      fig.addEventListener('click', function(){
        box.querySelector('img').src = url;
        box.querySelector('div').textContent =
          [txt(r.Name), txt(r.Film), txt(r.Caption), txt(r.Timecode)].filter(Boolean).join('  \u2014  ');
        box.style.display = 'flex';
      });
      grid.appendChild(fig);
    });
  }

  box.addEventListener('click', function(){ box.style.display='none'; });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') box.style.display='none'; });
  q.addEventListener('input', render);
  sel.addEventListener('change', render);

  grist.ready({
    requiredAccess:'read table',
    columns:[
      {name:'Image',    title:'Image',    type:'Attachments'},
      {name:'Name',     title:'Person',   type:'Any', optional:true},
      {name:'Film',     title:'Film',     type:'Any', optional:true},
      {name:'Caption',  title:'Caption',  type:'Any', optional:true},
      {name:'Timecode', title:'Timecode', type:'Any', optional:true},
      {name:'Purpose',  title:'Purpose',  type:'Any', optional:true}
    ]
  });

  grist.onRecords(function(records){
    recs = (records||[]).map(function(rec){ return grist.mapColumnNames(rec) || {Image:rec.Image}; });
    var seen = {}, opts = ['<option value="">All purposes</option>'];
    recs.forEach(function(r){
      var p = txt(r.Purpose);
      if (p && !seen[p]){ seen[p]=1; opts.push('<option>'+p.replace(/</g,'&lt;')+'</option>'); }
    });
    var keep = sel.value;
    sel.innerHTML = opts.join('');
    sel.value = keep;
    render();
  });
})();
</script>
</body>
</html>
