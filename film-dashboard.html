<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film Dashboard</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{--bg:#fff;--fg:#1c1c1c;--muted:#6b7280;--line:#e3e3e6;--chip:#f3f4f6;--card:#fafafa;
    --ok:#16b378;--bad:#d9534f;--warn:#e5a83b;--accent:#16b378}
  @media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--fg:#eaeaea;--muted:#9aa0a6;--line:#3a3a3a;
    --chip:#2c2c2c;--card:#262626}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #root{padding:14px;max-width:1100px}
  .hero{display:flex;gap:16px;margin-bottom:18px}
  .poster{flex:0 0 auto;width:132px;height:190px;border-radius:6px;border:1px solid var(--line);
    background:var(--chip) center/cover no-repeat}
  .poster.empty{background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 8px,var(--card) 8px,var(--card) 16px)}
  h1{margin:0 0 2px;font-size:21px;line-height:1.2}
  .alt{color:var(--muted);font-size:14px;margin-bottom:8px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .badge{font-size:11px;padding:2px 9px;border-radius:11px;background:var(--chip);border:1px solid var(--line)}
  .badge.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .badge.bad{background:var(--bad);border-color:var(--bad);color:#fff}
  .badge.warn{background:var(--warn);border-color:var(--warn);color:#1c1c1c}
  .note{font-size:12px;color:var(--muted);max-width:640px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    margin:20px 0 8px;font-weight:600}
  .grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
  .rel{border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--card)}
  .rel .t{font-weight:600;margin-bottom:2px}
  .rel .sub{color:var(--muted);font-size:11px;margin-bottom:6px}
  .qual{display:inline-block;letter-spacing:1px;color:var(--warn)}
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:10px;padding:1px 7px;border-radius:9px;background:var(--chip);border:1px solid var(--line)}
  .chip.a{border-color:var(--accent)}
  .own{float:right;font-size:10px;padding:1px 7px;border-radius:9px}
  .own.Owned{background:var(--ok);color:#fff}
  .own.Wanted{background:var(--warn);color:#1c1c1c}
  .own.Passed,.own.Sold,.own.Lost{background:var(--chip);color:var(--muted)}
  .cast{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .p{text-align:center}
  .p .ph{width:100%;aspect-ratio:3/4;border-radius:5px;border:1px solid var(--line);
    background:var(--chip) center/cover no-repeat;margin-bottom:4px}
  .p .ph.empty{background:repeating-linear-gradient(45deg,var(--chip),var(--chip) 6px,var(--card) 6px,var(--card) 12px)}
  .p .n{font-size:11px;font-weight:600;line-height:1.25}
  .p .c{font-size:10px;color:var(--muted)}
  table.sc{width:100%;border-collapse:collapse;font-size:12px}
  table.sc th,table.sc td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
  table.sc th{color:var(--muted);font-weight:600;font-size:11px}
  .bar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .checklist{font-size:12px}
  .checklist div{padding:2px 0}
  .empty-msg{color:var(--muted);font-size:12px}
  #msg{padding:30px;text-align:center;color:var(--muted)}
  #picker{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 14px 8px;
    border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  #q{flex:1;max-width:420px;padding:6px 11px;border:1px solid var(--line);border-radius:16px;
    background:var(--card);color:var(--fg);font:inherit;outline:none}
  #q:focus{border-color:var(--accent)}
  #hits{position:absolute;top:44px;left:14px;width:420px;max-height:300px;overflow:auto;z-index:30;
    background:var(--bg);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 6px 22px rgba(0,0,0,.35);display:none}
  #hits div{padding:6px 11px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12px}
  #hits div:last-child{border-bottom:0}
  #hits div:hover,#hits div.sel{background:var(--chip)}
  #hits .yr{color:var(--muted)}
  #hits .st{float:right;font-size:10px;color:var(--muted)}
  #count{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="picker"><input id="q" placeholder="Search a film by title or year…" autocomplete="off"><span id="count"></span><div id="hits"></div></div>
<div id="msg">Select a film&hellip;</div>
<div id="root"></div>
<script>
(function(){
  "use strict";
  var T={films:'Films',rel:'Releases',aud:'AudioTracks',sub:'SubtitleTracks',scenes:'Scenes',
         avail:'SceneAvailability',credits:'Credits',people:'People',masters:'Masters',extras:'Extras'};
  var root=document.getElementById('root'),msg=document.getElementById('msg');
  var filmId=null,tok=null,tokAt=0;

  function show(h){msg.style.display=h?'block':'none';if(h)msg.innerHTML=h;root.style.display=h?'none':'block';}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function listText(v){
    if(v==null)return '';
    if(Array.isArray(v))return (v[0]==='L'?v.slice(1):v).join(', ');
    return String(v);
  }
  function recs(t){if(!t||!t.id)return[];var k=Object.keys(t),n=t.id.length,o=[];
    for(var i=0;i<n;i++){var r={};for(var j=0;j<k.length;j++)r[k[j]]=t[k[j]][i];o.push(r);}return o;}
  function att(v){if(v==null)return null;if(typeof v==='number')return v;
    if(Array.isArray(v)){var a=v[0]==='L'?v.slice(1):v;return a.length?a[0]:null;}return null;}
  async function token(){if(!tok||(Date.now()-tokAt)>60000){tok=await grist.docApi.getAccessToken({readOnly:true});tokAt=Date.now();}return tok;}
  function url(t,id){return t.baseUrl+'/attachments/'+id+'/download?auth='+encodeURIComponent(t.token);}
  function stars(n){n=Number(n)||0;return '\u2605'.repeat(n)+'<span style="color:var(--line)">'+'\u2605'.repeat(5-n)+'</span>';}
  function get(tbl){return grist.docApi.fetchTable(tbl).then(recs).catch(function(){return[];});}

  async function render(film){
    if(!film){show('Select a film&hellip;');return;}
    var d=await Promise.all([get(T.rel),get(T.aud),get(T.sub),get(T.scenes),get(T.avail),
                             get(T.credits),get(T.people),get(T.masters),get(T.extras)]);
    var rel=d[0].filter(function(r){return r.Film===film.id;}),
        aud=d[1],sub=d[2],
        scenes=d[3].filter(function(s){return s.Film===film.id;}),
        avail=d[4],
        credits=d[5].filter(function(c){return c.Film===film.id;}),
        people=d[6],masters=d[7].filter(function(m){return m.Film===film.id;}),
        extras=d[8].filter(function(e){return e.Film===film.id;});
    var pById={};people.forEach(function(p){pById[p.id]=p;});
    var t=null;try{t=await token();}catch(e){}
    show('');

    var owned=rel.filter(function(r){return r.Ownership==='Owned';}).length;
    var h=[];

    // hero
    var pid=att(film.Poster);
    h.push('<div class="hero">');
    h.push(pid&&t?'<div class="poster" style="background-image:url(\''+url(t,pid)+'\')"></div>'
                 :'<div class="poster empty"></div>');
    h.push('<div><h1>'+esc(film.Original_Title||'(untitled)')+
           (film.Year?' <span style="color:var(--muted);font-weight:400">('+parseInt(film.Year,10)+')</span>':'')+'</h1>');
    if(film.English_Title&&film.English_Title!==film.Original_Title)
      h.push('<div class="alt">'+esc(film.English_Title)+'</div>');
    h.push('<div class="badges">');
    if(film.Branch)h.push('<span class="badge">'+esc(film.Branch)+'</span>');
    if(film.Setting_Era)h.push('<span class="badge">'+esc(film.Setting_Era)+'</span>');
    if(film.Director)h.push('<span class="badge">dir. '+esc(film.Director)+'</span>');
    h.push('<span class="badge '+(owned?'ok':'')+'">'+(owned?owned+' owned':'none owned')+'</span>');
    h.push('<span class="badge">'+rel.length+' release'+(rel.length===1?'':'s')+'</span>');
    h.push('<span class="badge '+(film.Eng_Audio_Found?'ok':'bad')+'">Eng dub '+(film.Eng_Audio_Found?'\u2713':'\u2715')+'</span>');
    h.push('<span class="badge '+(film.Eng_Subs_Found?'ok':'bad')+'">Eng subs '+(film.Eng_Subs_Found?'\u2713':'\u2715')+'</span>');
    if(film.Master_Status)h.push('<span class="badge '+(film.Master_Status==='Mastered'?'ok':'warn')+'">'+esc(film.Master_Status)+'</span>');
    if(film.Upgrade_Status){
      var up=film.Upgrade_Status;
      var k=up==='Best available obtained'?'ok':(up==='Nothing good exists'?'bad':'warn');
      h.push('<span class="badge '+k+'">'+esc(up)+'</span>');
    }
    if(film.Upgrade_Available){
      var ur=(await get(T.rel)).filter(function(x){return x.id===film.Upgrade_Available;})[0];
      if(ur)h.push('<span class="badge warn">upgrade: '+esc(ur.Title_On_Release||'')+'</span>');
    }
    h.push('</div>');
    if(film.Best_Version_Notes)h.push('<div class="note">'+esc(film.Best_Version_Notes)+'</div>');
    h.push('</div></div>');

    // releases
    h.push('<h2>Releases</h2>');
    if(!rel.length)h.push('<div class="empty-msg">None logged yet.</div>');
    else{
      h.push('<div class="grid">');
      rel.forEach(function(r){
        var a=aud.filter(function(x){return x.Release===r.id;}),
            s=sub.filter(function(x){return x.Release===r.id;});
        h.push('<div class="rel">');
        if(r.Ownership)h.push('<span class="own '+esc(r.Ownership)+'">'+esc(r.Ownership)+'</span>');
        h.push('<div class="t">'+esc(r.Title_On_Release||'(untitled)')+'</div>');
        h.push('<div class="sub">'+esc([r.Format,r.Country,r.Region_Code,r.Video_Standard,
               r.Aspect_Ratio,(r.Runtime_Min?r.Runtime_Min+' min':'')].filter(Boolean).join(' \u00b7 '))+'</div>');
        if(r.Video_Quality)h.push('<div class="qual">'+stars(r.Video_Quality)+'</div>');
        if(r.Cut_Status)h.push('<div class="sub" style="margin:4px 0 0">'+esc(r.Cut_Status)+
          (r.Cropping?' \u00b7 '+esc(r.Cropping):'')+'</div>');
        h.push('<div class="chips">');
        a.forEach(function(x){h.push('<span class="chip a">'+esc(x.Language)+(x.Track_Type==='Dub'?' dub':'')+'</span>');});
        s.forEach(function(x){h.push('<span class="chip">'+esc(x.Language)+' sub</span>');});
        if(!a.length&&!s.length)h.push('<span class="chip" style="color:var(--muted)">no tracks logged</span>');
        h.push('</div></div>');
      });
      h.push('</div>');
    }

    // scenes
    h.push('<h2>Contested scenes</h2>');
    if(!scenes.length)h.push('<div class="empty-msg">None logged. Add rows to Scenes only for moments that differ between releases.</div>');
    else{
      h.push('<table class="sc"><tr><th>Scene</th><th>On</th><th>Missing from</th></tr>');
      scenes.sort(function(a,b){return (a.Scene_No||0)-(b.Scene_No||0);}).forEach(function(sc){
        var av=avail.filter(function(x){return x.Scene===sc.id;});
        var on=av.filter(function(x){return x.Presence==='Present';}).length;
        var off=av.filter(function(x){return x.Presence==='Absent';}).length;
        h.push('<tr><td>'+esc((sc.Scene_No?sc.Scene_No+'. ':'')+(sc.Title||''))+
               (sc.Reference_Timecode?' <span style="color:var(--muted)">'+esc(sc.Reference_Timecode)+'</span>':'')+
               '</td><td>'+on+'</td><td>'+off+'</td></tr>');
      });
      h.push('</table>');
    }

    // master
    h.push('<h2>Master</h2>');
    if(!masters.length)h.push('<div class="empty-msg">No build planned.</div>');
    else masters.forEach(function(m){
      h.push('<div class="rel"><div class="t">'+esc(m.Version_Name||'Master')+
             ' <span class="badge">'+esc(m.Status||'')+'</span></div>');
      if(m.Source_Checklist)h.push('<div class="checklist"><div>'+esc(m.Source_Checklist)+'</div></div>');
      if(m.Conversion_Needed&&m.Conversion_Needed!=='None')
        h.push('<div class="sub">Conversion: '+esc(m.Conversion_Needed)+'</div>');
      if(m.Custom_Filename)h.push('<div class="sub" style="margin-top:5px">'+esc(m.Custom_Filename)+'</div>');
      if(m.Open_Issues)h.push('<div class="note" style="margin-top:6px">'+esc(m.Open_Issues)+'</div>');
      h.push('</div>');
    });

    // cast
    h.push('<h2>Cast &amp; crew</h2>');
    if(!credits.length)h.push('<div class="empty-msg">None logged.</div>');
    else{
      h.push('<div class="cast">');
      credits.sort(function(a,b){return (a.Billing_Order||99)-(b.Billing_Order||99);}).forEach(function(c){
        var p=pById[c.Person]||{},ph=att(p.Photo);
        h.push('<div class="p">'+(ph&&t?'<div class="ph" style="background-image:url(\''+url(t,ph)+'\')"></div>'
                                       :'<div class="ph empty"></div>')+
               '<div class="n">'+esc(p.Credited_Name||'?')+'</div>'+
               '<div class="c">'+esc(c.Character_Name||listText(c.Credit_Type))+'</div></div>');
      });
      h.push('</div>');
    }

    if(extras.length){
      h.push('<h2>Extras</h2><div class="chips">');
      extras.forEach(function(e){h.push('<span class="chip">'+esc(e.Category||'')+': '+esc(e.Title||'')+'</span>');});
      h.push('</div>');
    }

    root.innerHTML=h.join('');
  }

  // ---------------------------------------------------------------- picker --
  var films=[],hi=-1,suppress=0;
  var q=document.getElementById('q'),hits=document.getElementById('hits'),
      cnt=document.getElementById('count');

  function label(f){
    var t=f.Original_Title||f.English_Title||'(untitled)';
    var e=(f.English_Title&&f.English_Title!==f.Original_Title)?f.English_Title:'';
    return {t:t,e:e,y:f.Year?parseInt(f.Year,10):''};
  }
  function matches(f,words){
    var hay=[f.Original_Title,f.English_Title,f.Alt_Titles,f.Year?parseInt(f.Year,10):'',
             f.Director,f.Branch].filter(Boolean).join(' ').toLowerCase();
    return words.every(function(w){return hay.indexOf(w)>=0;});
  }
  function drawHits(){
    var s=q.value.trim().toLowerCase();
    var words=s?s.split(/\s+/):[];
    var list=(words.length?films.filter(function(f){return matches(f,words);}):films).slice(0,60);
    if(!list.length){hits.style.display='none';return;}
    hits.innerHTML=list.map(function(f,i){
      var L=label(f);
      return '<div data-id="'+f.id+'" class="'+(i===hi?'sel':'')+'">'+
        (f.Master_Status?'<span class="st">'+esc(f.Master_Status)+'</span>':'')+
        '<b>'+esc(L.t)+'</b> <span class="yr">'+(L.y||'')+'</span>'+
        (L.e?'<br><span class="yr">'+esc(L.e)+'</span>':'')+'</div>';
    }).join('');
    hits.style.display='block';
    Array.prototype.forEach.call(hits.children,function(d){
      d.onmousedown=function(ev){ev.preventDefault();pick(Number(d.getAttribute('data-id')));};
    });
  }
  function pick(id){
    var f=films.filter(function(x){return x.id===id;})[0];
    if(!f)return;
    filmId=id;hits.style.display='none';q.value='';q.blur();hi=-1;
    suppress=Date.now();
    try{grist.setCursorPos({rowId:id});}catch(e){}
    render(f);
  }
  q.addEventListener('focus',function(){hi=-1;drawHits();});
  q.addEventListener('input',function(){hi=-1;drawHits();});
  q.addEventListener('blur',function(){setTimeout(function(){hits.style.display='none';},150);});
  q.addEventListener('keydown',function(e){
    var rows=hits.children;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!rows.length)return;
      hi=e.key==='ArrowDown'?Math.min(hi+1,rows.length-1):Math.max(hi-1,0);
      Array.prototype.forEach.call(rows,function(r,i){r.classList.toggle('sel',i===hi);});
      if(rows[hi])rows[hi].scrollIntoView({block:'nearest'});
    } else if(e.key==='Enter'){
      if(hi>=0&&rows[hi])pick(Number(rows[hi].getAttribute('data-id')));
      else if(rows.length===1)pick(Number(rows[0].getAttribute('data-id')));
    } else if(e.key==='Escape'){hits.style.display='none';q.blur();}
  });

  async function loadFilms(){
    try{
      films=await get(T.films);
      films.sort(function(a,b){
        return String(a.Original_Title||'').localeCompare(String(b.Original_Title||''));});
      cnt.textContent=films.length+' films';
    }catch(e){films=[];}
  }

  grist.ready({requiredAccess:'full'});
  grist.onRecord(function(rec){
    if(Date.now()-suppress<1200)return;      // we just picked one ourselves
    if(!rec)return;
    filmId=rec.id;render(rec);
  });
  grist.onRecords(function(){ loadFilms(); });
  loadFilms().then(function(){
    if(filmId===null&&films.length) show('Search for a film above to begin.');
  });
})();
</script>
</body>
</html>
