<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Compare</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --bg:#ffffff; --fg:#1c1c1c; --muted:#6b7280; --line:#e3e3e6;
    --chip:#f3f4f6; --chip-on:#16b378; --chip-on-fg:#fff; --shadow:0 1px 3px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1e1e1e; --fg:#eaeaea; --muted:#9aa0a6; --line:#3a3a3a; --chip:#2c2c2c; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:14px;
    padding:3px 10px;cursor:pointer;font-size:12px;user-select:none}
  .chip:hover{border-color:var(--muted)}
  .chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:11px}
  #grid{display:grid;gap:10px;padding:10px;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  #grid.cols-1{grid-template-columns:1fr}
  #grid.cols-2{grid-template-columns:repeat(2,1fr)}
  #grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--chip);
    box-shadow:var(--shadow);display:flex;flex-direction:column}
  .view{width:100%;aspect-ratio:16/9;background-repeat:no-repeat;background-color:#000;
    background-position:center;background-size:contain;cursor:crosshair;image-rendering:auto}
  .view.zoomed{image-rendering:pixelated}
  .meta{padding:6px 8px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
  .name{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-left:auto}
  #msg{padding:24px;color:var(--muted);text-align:center;line-height:1.7}
  code{background:var(--chip);padding:1px 4px;border-radius:3px;font-size:11px}
</style>
</head>
<body>
<div id="bar">
  <span class="hint">Zoom</span>
  <button class="chip on" data-zoom="1">Fit</button>
  <button class="chip" data-zoom="2">2&times;</button>
  <button class="chip" data-zoom="4">4&times;</button>
  <button class="chip" data-zoom="8">8&times;</button>
  <button class="chip" id="sync">Sync pan: on</button>
  <span class="spacer"></span>
  <span class="hint" id="count"></span>
</div>
<div id="msg">Waiting for data&hellip;</div>
<div id="grid"></div>

<script>
(function(){
  "use strict";

  var state = { zoom:1, sync:true, px:0.5, py:0.5, records:[], tok:null, tokAt:0 };

  var grid  = document.getElementById('grid');
  var msg   = document.getElementById('msg');
  var count = document.getElementById('count');

  function show(text){ msg.style.display = text ? 'block' : 'none'; if(text) msg.innerHTML = text; }

  // Attachment cells arrive either as [id, id...] or as the encoded ['L', id, ...] form.
  function firstAttachment(v){
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return v;
    if (Array.isArray(v)){
      var a = (v[0] === 'L') ? v.slice(1) : v;
      return a.length ? a[0] : null;
    }
    return null;
  }

  async function accessToken(){
    // Tokens are short-lived; re-request if older than 60s.
    if (!state.tok || (Date.now() - state.tokAt) > 60000){
      state.tok  = await grist.docApi.getAccessToken({readOnly:true});
      state.tokAt = Date.now();
    }
    return state.tok;
  }

  function applyView(el){
    if (state.zoom <= 1){
      el.style.backgroundSize = 'contain';
      el.style.backgroundPosition = 'center';
      el.classList.remove('zoomed');
    } else {
      el.style.backgroundSize = (state.zoom * 100) + '% auto';
      el.style.backgroundPosition = (state.px*100).toFixed(2) + '% ' + (state.py*100).toFixed(2) + '%';
      el.classList.add('zoomed');
    }
  }
  function applyAll(){
    var views = grid.querySelectorAll('.view');
    for (var i=0;i<views.length;i++) applyView(views[i]);
  }

  function onMove(e){
    if (state.zoom <= 1) return;
    var r = e.currentTarget.getBoundingClientRect();
    state.px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    state.py = Math.min(1, Math.max(0, (e.clientY - r.top)  / r.height));
    if (state.sync) applyAll(); else applyView(e.currentTarget);
  }

  async function render(){
    var recs = state.records;
    if (!recs || !recs.length){
      grid.innerHTML = '';
      count.textContent = '';
      show('No stills for this selection.<br><span class="hint">Pick a row in the FrameSets widget, ' +
           'and make sure this widget\'s <code>SELECT BY</code> points at it.</span>');
      return;
    }

    var tok;
    try { tok = await accessToken(); }
    catch (err){
      show('Could not get an access token for the attachments.<br>' +
           '<span class="hint">Set this widget\'s access level to <code>Read selected table</code> or higher.</span>');
      return;
    }

    show('');
    grid.innerHTML = '';
    grid.className = recs.length <= 3 ? ('cols-' + recs.length) : '';
    count.textContent = recs.length + ' frame' + (recs.length === 1 ? '' : 's');

    recs.forEach(function(r){
      var id = firstAttachment(r.Image);
      var card = document.createElement('div');
      card.className = 'card';

      var view = document.createElement('div');
      view.className = 'view';
      if (id){
        view.style.backgroundImage = 'url("' + tok.baseUrl + '/attachments/' + id +
                                     '/download?auth=' + encodeURIComponent(tok.token) + '")';
      } else {
        view.style.background = 'repeating-linear-gradient(45deg,#222,#222 8px,#2a2a2a 8px,#2a2a2a 16px)';
      }
      view.addEventListener('mousemove', onMove);
      applyView(view);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = (r.Label === null || r.Label === undefined || r.Label === '')
        ? (id ? 'Untitled' : 'No image attached') : String(r.Label);
      name.title = name.textContent;
      var tc = document.createElement('span');
      tc.className = 'tc';
      tc.textContent = r.Timecode ? String(r.Timecode) : '';
      meta.appendChild(name); meta.appendChild(tc);

      card.appendChild(view); card.appendChild(meta);
      grid.appendChild(card);
    });
  }

  // ---- toolbar -------------------------------------------------------------
  Array.prototype.forEach.call(document.querySelectorAll('[data-zoom]'), function(btn){
    btn.addEventListener('click', function(){
      state.zoom = Number(btn.getAttribute('data-zoom'));
      Array.prototype.forEach.call(document.querySelectorAll('[data-zoom]'), function(b){
        b.classList.toggle('on', b === btn);
      });
      applyAll();
    });
  });
  document.getElementById('sync').addEventListener('click', function(){
    state.sync = !state.sync;
    this.textContent = 'Sync pan: ' + (state.sync ? 'on' : 'off');
    this.classList.toggle('on', state.sync);
  });
  document.getElementById('sync').classList.add('on');

  // ---- Grist ---------------------------------------------------------------
  grist.ready({
    requiredAccess: 'read table',
    columns: [
      {name:'Image',    title:'Screenshot', type:'Attachments',
       description:'The Stills.Image column.'},
      {name:'Label',    title:'Caption',    type:'Any', optional:true,
       description:'What to print under each frame - usually Release.'},
      {name:'Timecode', title:'Timecode',   type:'Any', optional:true}
    ]
  });

  grist.onRecords(function(records){
    state.records = (records || []).map(function(rec){
      var m = grist.mapColumnNames(rec);
      return m || {Image:rec.Image, Label:rec.Caption, Timecode:rec.Timecode};
    });
    render();
  });
})();
</script>
</body>
</html>
